[project]
name = "wardrobe-ai"
version = "0.1.0"
description = "Wardrobe AI 推理服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=2.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
# 真正接模型时再装这些（约 4-6 GB）
gpu = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "accelerate>=0.34",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardrobe_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
